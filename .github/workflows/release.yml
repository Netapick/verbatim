name: release

# Construit l'installateur, le signe pour la mise à jour intégrée à l'application (minisign) et publie la release
# avec l'installateur, sa signature (.sig) et latest.json (le fichier que l'application interroge).
# Déclenchement : pousser un tag « vX.Y.Z » (la version doit déjà être montée dans les fichiers du projet).
# La release est toujours créée en BROUILLON (privée) : on vérifie les fichiers, on y joint les packs du moteur s'il y en a
# de nouveaux, puis on la publie à la main (« Publish release »). Tant qu'elle est en brouillon, l'application ne la voit pas.
# Un tag avec un suffixe (v0.4.1-beta) est en plus marqué préversion : jamais proposée par la mise à jour, même publiée.
# Secrets GitHub : TAURI_SIGNING_PRIVATE_KEY (obligatoire : contenu du fichier .secrets/verbatim-updater.key),
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (seulement si la clé a un mot de passe).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Version et type de release (un tag avec suffixe est une préversion). Pas d'horodatage : il est réservé aux versions de développement
      - name: Version
        id: stamp
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          case "${{ github.ref_name }}" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build, signature et brouillon de release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: v${{ steps.stamp.outputs.version }}
          releaseBody: "Voir les changements de cette version."
          releaseDraft: true
          prerelease: ${{ steps.stamp.outputs.pre == 'true' }}

      # Notes de la release : la section de CHANGELOG.md de cette version (affichées dans « Notes de version »),
      # suivie de la somme SHA-256 de l'installateur pour vérifier un téléchargement (voir docs/SIGNATURE.md)
      - name: Notes de version et somme SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          v="${{ steps.stamp.outputs.version }}"
          awk -v v="$v" '$0 == "## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          node scripts/checksums.mjs notes.md
          # par identifiant : « gh release edit <tag> » ne trouve pas un brouillon
          if [ -s notes.md ]; then gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}" -F "body=@notes.md" > /dev/null; fi
