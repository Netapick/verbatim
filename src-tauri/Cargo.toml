[package]
name = "verbatim"
version = "0.4.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }   # icône de la zone de notification
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"   # mise à jour dans l'app (téléchargement, signature minisign, installation)
tauri-plugin-process = "2"   # redémarrage après la mise à jour
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.18.2"
sha2 = "0.10"
earshot = "1.2.2"
regex = "1"             # détection des présentations (« bonjour, je suis X »)
sherpa-onnx = "2.0.0"   # séparation des intervenants (ONNX Runtime embarqué, sur CPU)

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi"] }   # découpe de la pastille d'enregistrement en pilule (flou)

[profile.release]
opt-level = 3        # décodage audio (symphonia) nettement plus rapide qu'en "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2        # sans optimisation, le décodage audio est ~40 fois plus lent (60 s au lieu de 1,5 s pour 15 min)
